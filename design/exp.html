                <script>
                    (() => {
                        "use strict";

                        const modes = [
                            {
                                className: "protanopia",
                                label: "Rotblindheit",
                                icon: "visibility",
                                matrix: [0.152286, 1.052583, -0.204868, 0, 0, 0.114503, 0.786281, 0.099216, 0, 0, -0.003882, -0.048116, 1.051998, 0, 0, 0, 0, 0, 1, 0],
                            },
                            {
                                className: "deuteranopia",
                                label: "Grünblindheit",
                                icon: "contrast",
                                matrix: [0.367322, 0.860646, -0.227968, 0, 0, 0.280085, 0.672501, 0.047413, 0, 0, -0.01182, 0.04294, 0.968881, 0, 0, 0, 0, 0, 1, 0],
                            },
                            {
                                className: "blue-yellow-confusion",
                                label: "Blau-Gelb-Konfusion",
                                icon: "gradient",
                                matrix: [1.255528, -0.076749, -0.178779, 0, 0, -0.078411, 0.930809, 0.147602, 0, 0, 0.004733, 0.691367, 0.3039, 0, 0, 0, 0, 0, 1, 0],
                            },
                            {
                                className: "monochromopsia",
                                label: "Farbenblindheit",
                                icon: "tonality",
                                matrix: [0.299, 0.587, 0.114, 0, 0, 0.299, 0.587, 0.114, 0, 0, 0.299, 0.587, 0.114, 0, 0, 0, 0, 0, 1, 0],
                            },
                        ];

                        function createFilterDefinitions(svg, figureIndex) {
                            let defs = svg.querySelector("defs");
                            if (!defs) {
                                defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
                                svg.insertBefore(defs, svg.firstChild);
                            }

                            const filterIds = {};

                            modes.forEach((mode) => {
                                const filterId = `cvd-${figureIndex}-${mode.className}`;
                                const filter = document.createElementNS("http://www.w3.org/2000/svg", "filter");
                                const colorMatrix = document.createElementNS("http://www.w3.org/2000/svg", "feColorMatrix");

                                filter.setAttribute("id", filterId);
                                filter.setAttribute("color-interpolation-filters", "sRGB");

                                colorMatrix.setAttribute("type", "matrix");
                                colorMatrix.setAttribute("values", mode.matrix.join(" "));

                                filter.appendChild(colorMatrix);
                                defs.appendChild(filter);

                                filterIds[mode.className] = filterId;
                            });
                            return filterIds;
                        }

                        function configureFigure(figure, figureIndex) {
                            const buttons = Array.from(figure.children).filter((element) => element.tagName.toLowerCase() === "button");

                            const svg = figure.querySelector("svg");

                            if (!svg || buttons.length < modes.length) {
                                return;
                            }

                            figure.classList.add("cvd-figure");

                            svg.setAttribute("data-cvd-svg", "");

                            const filterIds = createFilterDefinitions(svg, figureIndex);

                            const originalLabel = svg.getAttribute("aria-label");

                            buttons.slice(0, modes.length).forEach((button, index) => {
                                const mode = modes[index];

                                button.type = "button";

                                button.dataset.cvdMode = mode.className;

                                button.title = `${mode.label} simulieren`;

                                button.setAttribute("aria-label", `${mode.label} simulieren`);

                                button.setAttribute("aria-pressed", "false");

                                button.innerHTML = `

<span class="material-symbols-outlined" aria-hidden="true">

${mode.icon}

</span>

<span class="cvd-sr-only">${mode.label}</span>

`;

                                button.addEventListener("click", () => {
                                    const isActive = figure.classList.contains(mode.className);

                                    modes.forEach((otherMode) => {
                                        figure.classList.remove(otherMode.className);

                                        const otherButton = figure.querySelector(`[data-cvd-mode="${otherMode.className}"]`);

                                        if (otherButton) {
                                            otherButton.classList.remove("is-active");

                                            otherButton.setAttribute("aria-pressed", "false");

                                            otherButton.title = `${otherMode.label} simulieren`;

                                            otherButton.setAttribute("aria-label", `${otherMode.label} simulieren`);
                                        }
                                    });

                                    svg.style.filter = "";

                                    if (!isActive) {
                                        figure.classList.add(mode.className);

                                        svg.style.filter = `url("#${filterIds[mode.className]}")`;

                                        button.classList.add("is-active");

                                        button.setAttribute("aria-pressed", "true");

                                        button.title = `${mode.label} deaktivieren`;

                                        button.setAttribute("aria-label", `${mode.label} deaktivieren`);

                                        svg.setAttribute("aria-label", `${originalLabel || "Semantische Farben"} – Simulation: ${mode.label}`);
                                    } else {
                                        svg.setAttribute("aria-label", originalLabel || "Semantische Farben");
                                    }
                                });
                            });
                        }

                        function initColorVisionControls() {
                            document.querySelectorAll("figure").forEach((figure, index) => {
                                configureFigure(figure, index + 1);
                            });
                        }

                        if (document.readyState === "loading") {
                            document.addEventListener("DOMContentLoaded", initColorVisionControls);
                        } else {
                            initColorVisionControls();
                        }
                    })();
                </script>

                                matrix: [0.152286, 1.052583, -0.204868, 0, 0, 0.114503, 0.786281, 0.099216, 0, 0, -0.003882, -0.048116, 1.051998, 0, 0, 0, 0, 0, 1, 0],
                            },
                            {
                                className: "deuteranopia",
                                label: "Grünblindheit",
                                icon: "contrast",
                                matrix: [0.367322, 0.860646, -0.227968, 0, 0, 0.280085, 0.672501, 0.047413, 0, 0, -0.01182, 0.04294, 0.968881, 0, 0, 0, 0, 0, 1, 0],
                            },
                            {
                                className: "blue-yellow-confusion",
                                label: "Blau-Gelb-Konfusion",
                                icon: "gradient",
                                matrix: [1.255528, -0.076749, -0.178779, 0, 0, -0.078411, 0.930809, 0.147602, 0, 0, 0.004733, 0.691367, 0.3039, 0, 0, 0, 0, 0, 1, 0],
                            },
                            {
                                className: "monochromopsia",
                                label: "Farbenblindheit",
                                icon: "tonality",
                                matrix: [0.299, 0.587, 0.114, 0, 0, 0.299, 0.587, 0.114, 0, 0, 0.299, 0.587, 0.114, 0, 0, 0, 0, 0, 1, 0],
                            },
                        ];

                        function createFilterDefinitions(svg, figureIndex) {
                            let defs = svg.querySelector("defs");
                            if (!defs) {
                                defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
                                svg.insertBefore(defs, svg.firstChild);
                            }

                            const filterIds = {};

                            modes.forEach((mode) => {
                                const filterId = `cvd-${figureIndex}-${mode.className}`;
                                const filter = document.createElementNS("http://www.w3.org/2000/svg", "filter");
                                const colorMatrix = document.createElementNS("http://www.w3.org/2000/svg", "feColorMatrix");

                                filter.setAttribute("id", filterId);
                                filter.setAttribute("color-interpolation-filters", "sRGB");

                                colorMatrix.setAttribute("type", "matrix");
                                colorMatrix.setAttribute("values", mode.matrix.join(" "));

                                filter.appendChild(colorMatrix);
                                defs.appendChild(filter);

                                filterIds[mode.className] = filterId;
                            });
                            return filterIds;
                        }

                        function configureFigure(figure, figureIndex) {
                            const buttons = Array.from(figure.children).filter((element) => element.tagName.toLowerCase() === "button");

                            const svg = figure.querySelector("svg");

                            if (!svg || buttons.length < modes.length) {
                                return;
                            }

                            figure.classList.add("cvd-figure");

                            svg.setAttribute("data-cvd-svg", "");

                            const filterIds = createFilterDefinitions(svg, figureIndex);

                            const originalLabel = svg.getAttribute("aria-label");

                            buttons.slice(0, modes.length).forEach((button, index) => {
                                const mode = modes[index];
                                button.type = "button";
                                button.dataset.cvdMode = mode.className;
                                button.title = `${mode.label} simulieren`;
                                button.setAttribute("aria-label", `${mode.label} simulieren`);
                                button.setAttribute("aria-pressed", "false");
                                button.innerHTML = `
<span class="material-symbols-outlined" aria-hidden="true">
${mode.icon}
</span>
<span class="cvd-sr-only">${mode.label}</span>
`;

                                button.addEventListener("click", () => {
                                    const isActive = figure.classList.contains(mode.className);

                                    modes.forEach((otherMode) => {
                                        figure.classList.remove(otherMode.className);

                                        const otherButton = figure.querySelector(`[data-cvd-mode="${otherMode.className}"]`);

                                        if (otherButton) {
                                            otherButton.classList.remove("is-active");

                                            otherButton.setAttribute("aria-pressed", "false");

                                            otherButton.title = `${otherMode.label} simulieren`;

                                            otherButton.setAttribute("aria-label", `${otherMode.label} simulieren`);
                                        }
                                    });

                                    svg.style.filter = "";

                                    if (!isActive) {
                                        figure.classList.add(mode.className);

                                        svg.style.filter = `url("#${filterIds[mode.className]}")`;

                                        button.classList.add("is-active");

                                        button.setAttribute("aria-pressed", "true");

                                        button.title = `${mode.label} deaktivieren`;

                                        button.setAttribute("aria-label", `${mode.label} deaktivieren`);

                                        svg.setAttribute("aria-label", `${originalLabel || "Semantische Farben"} – Simulation: ${mode.label}`);
                                    } else {
                                        svg.setAttribute("aria-label", originalLabel || "Semantische Farben");
                                    }
                                });
                            });
                        }

                        function initColorVisionControls() {
                            document.querySelectorAll("figure").forEach((figure, index) => {
                                configureFigure(figure, index + 1);
                            });
                        }

                        if (document.readyState === "loading") {
                            document.addEventListener("DOMContentLoaded", initColorVisionControls);
                        } else {
                            initColorVisionControls();
                        }
                    })();
                </script>
            </figure>
        </samp>
    </body>
</html>
